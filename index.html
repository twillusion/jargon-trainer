<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Jargon Trainer</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1d1c1a;--ink2:#56534c;--rule:#e3ded3;--acc:#0e7a63;--bad:#c25a1c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131311;--card:#1d1c19;--ink:#ecebe6;--ink2:#bab6ab;--rule:#33312c;--acc:#5fd0b1;--bad:#f2a26c}}
:root[data-theme="dark"]{--bg:#131311;--card:#1d1c19;--ink:#ecebe6;--ink2:#bab6ab;--rule:#33312c;--acc:#5fd0b1;--bad:#f2a26c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
#gate{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;visibility:hidden}
#gate.show{visibility:visible}
h1{font-size:1.15rem;font-weight:600;margin:0;color:var(--ink2)}
.dots{display:flex;gap:14px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink2);transition:background .1s}
.dots i.on{background:var(--ink);border-color:var(--ink)}
.dots.bad{animation:shake .35s}.dots.bad i{border-color:var(--bad)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink);font:inherit;font-size:1.7rem;cursor:pointer;touch-action:manipulation}
.pad button:active{background:var(--rule)}
.pad .ghost{border:0;background:transparent;font-size:1.3rem}
#msg{min-height:1.4em;font-size:.9rem;color:var(--ink2)}
</style>
<script>try{var t=localStorage.getItem('jt2-theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t))}catch(e){}</script>
</head>

  </div>
  <div id="msg"></div>
</div>

  function u(a){var s="";a=new Uint8Array(a);for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
  function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}

  function drop(){try{localStorage.removeItem(KEY)}catch(e){}}
  function open(raw){
    return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"])
      .then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:b(IV)},k,b(CT))})

    if(pin.length===6)setTimeout(tryPin,60);
  }
  function onKey(e){if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==="Backspace")press("del");}
  document.getElementById('pad').addEventListener('click',function(e){var t=e.target.closest('button');if(t)press(t.getAttribute('data-k')||t.textContent);});
  document.addEventListener('keydown',onKey);
  function prompt(){gate.className='show';}
  if(!window.crypto||!crypto.subtle){gate.className='show';msg.textContent="This browser cannot unlock the page. Use a current browser over https.";return;}
  var saved=get();
  if(saved){open(b(saved)).then(show).catch(function(){drop();prompt();});}else prompt();
})();
</script>
